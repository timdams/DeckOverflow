<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="De motor beslist, de stage speelt af" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
  <style>
    .ink { fill: #1B1A17; }
    .quiet { fill: #5C574E; }
    .edge { stroke: #8A8478; }
    .arrowhead { fill: #8A8478; }
    .main { fill: #0E5A61; fill-opacity: 0.12; stroke: #0E5A61; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ECE8DF; }
      .quiet { fill: #B5AFA3; }
      .edge { stroke: #8F897D; }
      .arrowhead { fill: #8F897D; }
      .main { fill: #4FB3BB; fill-opacity: 0.16; stroke: #4FB3BB; }
    }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <text class="ink" x="24" y="32" font-size="15" font-weight="600">De motor beslist, de stage speelt af</text>

  <rect class="edge" x="24" y="56" width="712" height="160" rx="8" fill="none" stroke-width="1"/>
  <text class="quiet" x="40" y="80" font-size="11.5" font-weight="600">Browser</text>

  <g class="edge" fill="none" stroke-width="1.25">
    <path d="M550 128H465" marker-end="url(#arch-arrow)"/>
    <path d="M295 128H210" marker-end="url(#arch-arrow)"/>
    <path d="M210 168H295" marker-end="url(#arch-arrow)"/>
    <path d="M465 168H550" marker-end="url(#arch-arrow)"/>
    <path d="M125 248V192" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>
    <path d="M380 192V248" stroke-dasharray="4 4" marker-end="url(#arch-arrow)"/>
  </g>

  <rect class="main" x="40" y="104" width="170" height="88" rx="8" stroke-width="2"/>
  <text class="ink" x="125" y="128" text-anchor="middle" font-weight="600">Regelmotor (C#)</text>
  <text class="ink" x="125" y="144" text-anchor="middle" font-size="11.5">Command in, events uit</text>
  <text class="ink" x="125" y="160" text-anchor="middle" font-size="11.5">Echte .NET-regels</text>
  <text class="ink" x="125" y="176" text-anchor="middle" font-size="11.5">Geen UI, geen tijd</text>

  <rect class="edge" x="295" y="104" width="170" height="88" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="380" y="128" text-anchor="middle" font-weight="600">Shell: Blazor WASM</text>
  <text class="ink" x="380" y="144" text-anchor="middle" font-size="11.5">Pagina's, orkestratie</text>
  <text class="ink" x="380" y="160" text-anchor="middle" font-size="11.5">StageBridge</text>
  <text class="ink" x="380" y="176" text-anchor="middle" font-size="11.5">Bewaart geen regels</text>

  <rect class="edge" x="550" y="104" width="170" height="88" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="635" y="128" text-anchor="middle" font-weight="600">Stage: JavaScript</text>
  <text class="ink" x="635" y="144" text-anchor="middle" font-size="11.5">PixiJS, GSAP, Howler</text>
  <text class="ink" x="635" y="160" text-anchor="middle" font-size="11.5">Events naar animaties</text>
  <text class="ink" x="635" y="176" text-anchor="middle" font-size="11.5">Hand, input, audio</text>

  <text class="quiet" x="252" y="120" text-anchor="middle" font-size="11.5">PlayCard</text>
  <text class="quiet" x="252" y="186" text-anchor="middle" font-size="11.5">events</text>
  <text class="quiet" x="507" y="120" text-anchor="middle" font-size="11.5">OnCardPlayed</text>
  <text class="quiet" x="507" y="186" text-anchor="middle" font-size="11.5">play, sync</text>

  <rect class="edge" x="40" y="248" width="170" height="56" rx="8" fill="none" stroke-width="1.25"/>
  <text class="ink" x="125" y="272" text-anchor="middle" font-weight="600">xUnit-tests</text>
  <text class="ink" x="125" y="288" text-anchor="middle" font-size="11.5">Regels, determinisme</text>

  <rect class="edge" x="295" y="248" width="170" height="56" rx="8" fill="none" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text class="quiet" x="380" y="272" text-anchor="middle" font-weight="600">Api + SQLite</text>
  <text class="quiet" x="380" y="288" text-anchor="middle" font-size="11.5">Pas bij MVP, Docker</text>
</svg>
