<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deck Overflow</title>
    <base href="/" />
    <!-- Op een telefoon: vanaf het beginscherm opent het spel liggend en zonder browserbalken -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#f7f5ee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/run.css" />
    <link rel="stylesheet" href="css/control-room.css" />
    <link rel="stylesheet" href="css/conveyor-belt.css" />
</head>

<body>
    <div id="app">
        <div class="overlay">
            <h1>Deck Overflow</h1>
            <p>laden...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Er liep iets mis. <a href="." class="reload">Herladen</a> <span class="dismiss">✕</span>
    </div>

    <!-- Startpunten in de browser. Opslag kan leeg terugkomen of falen (privévenster): dan begin je gewoon in act 1. -->
    <script>
        window.deckOverflow = {
            load: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
            save: (key, value) => { try { localStorage.setItem(key, value); } catch { } },
            // De taal van de spelteksten: één plek voor shell en stage, met de standaardtaal erbij.
            languages: ['nl', 'en'],
            lang: () => {
                const stored = window.deckOverflow.load('deckoverflow.lang');
                return window.deckOverflow.languages.includes(stored) ? stored : 'nl';
            },
            setLang: (lang) => {
                window.deckOverflow.save('deckoverflow.lang', lang);
                document.documentElement.lang = lang;
            },
            // Een strook die horizontaal scrolt (de ponsband) houdt haar element ".now" in beeld, in het midden.
            // Alleen de strook schuift, nooit de pagina.
            keepInView: (strip) => {
                const now = strip?.querySelector('.now');
                if (!now) return;
                const s = strip.getBoundingClientRect();
                const n = now.getBoundingClientRect();
                if (n.left >= s.left + 8 && n.right <= s.right - 8) return;
                // Vloeiend wacht op frames, en een verborgen tabblad tekent er geen: dan meteen
                strip.scrollBy({ left: n.left - s.left - s.width / 2 + n.width / 2, behavior: document.hidden ? 'auto' : 'smooth' });
            },
        };
        document.documentElement.lang = window.deckOverflow.lang();

        // Op een aanraakscherm: bij een tik naar volledig scherm en liggend vastzetten, zodat de
        // browserbalken geen plaats innemen. Kan alleen na een tik van de speler. Een iPhone kent
        // dit niet; daar helpt het manifest (zet op beginscherm). Wie het volledig scherm verlaat,
        // krijgt het pas terug na een herlaadbeurt.
        (() => {
            const root = document.documentElement;
            if (!matchMedia('(pointer: coarse)').matches || !root.requestFullscreen) return;
            let left = false;
            document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) left = true; });
            document.addEventListener('pointerup', () => {
                if (left || document.fullscreenElement) return;
                root.requestFullscreen({ navigationUI: 'hide' })
                    .then(() => screen.orientation?.lock?.('landscape'))
                    .catch(() => { });
            });
        })();
    </script>

    <!-- Stage-bibliotheken (vendored, geen CDN nodig) -->
    <script src="lib/pixi.min.js" defer></script>
    <script src="lib/gsap.min.js" defer></script>
    <script src="lib/howler.min.js" defer></script>
    <script type="module" src="audio/ui.js"></script>
    <script src="shared/touch-drag.js" defer></script>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
