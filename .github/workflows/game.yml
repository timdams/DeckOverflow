name: game-engine

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/DeckOverflow.Core.Tests
      - run: dotnet test tests/DeckOverflow.CardHall.Tests
      - run: dotnet test tests/DeckOverflow.ControlRoom.Tests
      - run: dotnet test tests/DeckOverflow.ConveyorBelt.Tests
      - run: dotnet build src/DeckOverflow.Web
